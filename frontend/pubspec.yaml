name: juries
description: OSJ — Open Source Justify learning edition with fictional demo data.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  dio: ^5.9.0
  get_it: ^8.2.0
  go_router: ^16.2.0
  shared_preferences: ^2.5.3
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/SourceSerif4-OFL.txt
    - assets/fonts/NotoSansBengali-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
