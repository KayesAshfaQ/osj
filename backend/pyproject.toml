[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "alembic>=1.13.0",
 "asyncpg>=0.30.0",
 "email-validator>=2.0",
 "fastapi==0.115.0",
 "fastembed>=0.8.0",
 "httpx>=0.28.1",
 "langchain>=0.3.0",
 "langchain-google-genai>=4,<5",
 "langchain-groq>=0.2.0",
 "langchain-huggingface>=1.2.2",
 "langchain-openai>=1.4.1",
 "langchain-qdrant>=1.1.0",
 "langchain-text-splitters>=1.1.2",
 "langgraph>=1.2.9",
 "langsmith>=0.10.10",
 "pydantic>=2.9.2",
 "pydantic-settings>=2.14.2",
 "python-dotenv==1.0.1",
 "qdrant-client>=1.19.0",
 "redis>=7.4.1",
 "resend>=2.0.0",
 "sentence-transformers>=2.2.2",
 "sqlalchemy[asyncio]>=2.0",
 "tenacity>=9.1.4",
 "tqdm>=4.66.0",
 "uvicorn[standard]==0.30.6",
]

[dependency-groups]
dev = [
 "pytest>=9.1.1",
 "pytest-asyncio>=0.21.0",
 "aiosqlite>=0.20.0",
 "ruff>=0.14,<1",
 "pyright>=1.1.400,<2",
 "tabulate",
 "beautifulsoup4>=4.15.0",
 "playwright>=1.64.0",
]

[tool.pytest.ini_options]
pythonpath = [ "." ]
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests with fakes and zero I/O",
    "integration: integration tests with SQLite, FastAPI ASGI transport, or local vector store",
    "architecture: architectural boundary and structural compliance tests",
    "embedding: opt-in embedding quality and vectorstore tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E402"]
"../scripts/tests/**" = ["ANN", "E402"]

[tool.pyright]
include = ["app", "tests", "scripts", "evals", "alembic"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportPrivateUsage = "none"
